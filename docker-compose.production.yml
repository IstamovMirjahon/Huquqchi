services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-huquqchi}
      POSTGRES_USER: ${POSTGRES_USER:-huquqchi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - huquqchi-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-huquqchi} -d ${POSTGRES_DB:-huquqchi}"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks: [backend]

  api:
    image: ${HUQUQCHI_IMAGE:?HUQUQCHI_IMAGE is required}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-huquqchi};Username=${POSTGRES_USER:-huquqchi};Password=${POSTGRES_PASSWORD}
      Jwt__Issuer: ${JWT_ISSUER:-huquqchi}
      Jwt__Audience: ${JWT_AUDIENCE:-huquqchi-mobile}
      Jwt__Key: ${JWT_KEY:?JWT_KEY is required}
      Jwt__AccessTokenMinutes: ${JWT_ACCESS_TOKEN_MINUTES:-15}
      Jwt__RefreshTokenDays: ${JWT_REFRESH_TOKEN_DAYS:-30}
      Otp__HashKey: ${OTP_HASH_KEY:?OTP_HASH_KEY is required}
      Telegram__BotUrl: ${TELEGRAM_BOT_URL:?TELEGRAM_BOT_URL is required}
      Storage__Path: /app/storage
      Database__AutoMigrate: "true"
      Files__PublicBaseUrl: ${FILES_PUBLIC_BASE_URL:-https://huquqchi-ai.uz}
      Files__SigningKey: ${FILES_SIGNING_KEY:-}
      ClamAv__Host: ${CLAMAV_HOST:-}
      ClamAv__Port: ${CLAMAV_PORT:-3310}
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN:-https://huquqchi-ai.uz}
      ForwardedHeaders__Enabled: ${FORWARDED_HEADERS_ENABLED:-false}
      Sms__Enabled: "false"
    volumes:
      - huquqchi-storage:/app/storage
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks: [backend]

  bot:
    image: ${HUQUQCHI_BOT_IMAGE:?HUQUQCHI_BOT_IMAGE is required}
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-huquqchi};Username=${POSTGRES_USER:-huquqchi};Password=${POSTGRES_PASSWORD}
      Otp__HashKey: ${OTP_HASH_KEY:?OTP_HASH_KEY is required}
      Telegram__BotToken: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]

  frontend:
    image: ${HUQUQCHI_FRONTEND_IMAGE:?HUQUQCHI_FRONTEND_IMAGE is required}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3501}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks: [backend]

networks:
  backend:
    driver: bridge

volumes:
  huquqchi-postgres:
  huquqchi-storage:
