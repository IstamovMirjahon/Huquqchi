name: Deploy to server

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: GHCR image tag to deploy
        required: true
        default: latest

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Upload production compose file
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          source: docker-compose.production.yml
          target: /home/deploy/huquqchi
          overwrite: true
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          API_IMAGE: ghcr.io/istamovmirjahon/huquqchi:${{ inputs.image_tag }}
          BOT_IMAGE: ghcr.io/istamovmirjahon/huquqchi-bot:${{ inputs.image_tag }}
          FRONTEND_IMAGE: ghcr.io/istamovmirjahon/huquqchi-frontend:${{ inputs.image_tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_URL: https://t.me/HuquqchiAuthBot
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          envs: API_IMAGE,BOT_IMAGE,FRONTEND_IMAGE,GHCR_USER,GHCR_TOKEN,TELEGRAM_BOT_TOKEN,TELEGRAM_BOT_URL
          script: |
            set -eu
            cd /home/deploy/huquqchi
            set_env() {
              key="$1"
              value="$2"
              if grep -q "^${key}=" .env; then
                sed -i "s|^${key}=.*|${key}=${value}|" .env
              else
                printf '%s=%s\n' "$key" "$value" >> .env
              fi
            }

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            set_env HUQUQCHI_IMAGE "$API_IMAGE"
            set_env HUQUQCHI_BOT_IMAGE "$BOT_IMAGE"
            set_env HUQUQCHI_FRONTEND_IMAGE "$FRONTEND_IMAGE"
            set_env TELEGRAM_BOT_TOKEN "$TELEGRAM_BOT_TOKEN"
            set_env TELEGRAM_BOT_URL "$TELEGRAM_BOT_URL"
            if ! grep -Eq '^OTP_HASH_KEY=.{32,}$' .env; then
              set_env OTP_HASH_KEY "$(openssl rand -hex 48)"
            fi
            chmod 600 .env
            docker compose -f docker-compose.production.yml pull api bot frontend
            docker compose -f docker-compose.production.yml up -d --remove-orphans
            docker compose -f docker-compose.production.yml ps
            curl --fail --retry 10 --retry-delay 5 http://127.0.0.1:${API_PORT:-8080}/health
            curl --fail --retry 10 --retry-delay 5 http://127.0.0.1:${FRONTEND_PORT:-3501}/health
