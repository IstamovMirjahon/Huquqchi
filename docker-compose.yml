services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: huquqchi
      POSTGRES_USER: huquqchi
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - huquqchi-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huquqchi -d huquqchi"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/Huquqchi.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=huquqchi;Username=huquqchi
      Jwt__Key: CHANGE-ME-use-at-least-32-random-characters-in-production
      Storage__Path: /app/storage
    ports:
      - "8080:8080"
    volumes:
      - huquqchi-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

volumes:
  huquqchi-postgres:
  huquqchi-storage:
